# Publishes the site to GitHub Pages on every push to main:
#   /            the original web app (index.html) and the old-iPad board (display.html)
#   /app/        the Expo app built for the web, to add to the home screen on phones and iPads
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci
      - name: Type-check
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Build the app for the web
        working-directory: mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/app
        run: npx expo export --platform web --output-dir ../_site/app
      - name: Add the original web app and iPad board
        run: |
          cp index.html display.html icon-180.png _site/
          cp -r data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
